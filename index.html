<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STEEEEEVE</title>
<meta name="description" content="Press the thing on Steve's chest.">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐒</text></svg>">
</head>
<body>

<!-- one gummy bear, defined once, stamped out many times and tinted by CSS `color` -->
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <symbol id="gummy" viewBox="0 0 40 54">
    <g fill="currentColor">
      <ellipse cx="10.5" cy="5.5" rx="4.6" ry="4.6"/>
      <ellipse cx="29.5" cy="5.5" rx="4.6" ry="4.6"/>
      <ellipse cx="20" cy="13.5" rx="9.4" ry="8.6"/>
      <ellipse cx="20" cy="34" rx="11" ry="13"/>
      <ellipse cx="6.5" cy="28" rx="5.2" ry="4.4" transform="rotate(-25 6.5 28)"/>
      <ellipse cx="33.5" cy="28" rx="5.2" ry="4.4" transform="rotate(25 33.5 28)"/>
      <ellipse cx="12" cy="47.5" rx="5.6" ry="5"/>
      <ellipse cx="28" cy="47.5" rx="5.6" ry="5"/>
    </g>
    <g fill="#000" opacity=".22">
      <circle cx="16.4" cy="12" r="1.5"/>
      <circle cx="23.6" cy="12" r="1.5"/>
      <ellipse cx="20" cy="17.4" rx="2.2" ry="1.5"/>
    </g>
    <g fill="#fff" opacity=".38">
      <ellipse cx="14.5" cy="28" rx="3.4" ry="6" transform="rotate(-14 14.5 28)"/>
      <ellipse cx="16" cy="9.5" rx="2.2" ry="2.8" transform="rotate(-20 16 9.5)"/>
    </g>
  </symbol>
</svg>

<div class="sky" aria-hidden="true">
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>
  <div class="cloud c4"></div>
  <div class="food f1">🍔</div>
  <div class="food f2">🥞</div>
  <div class="food f3">🍕</div>
  <div class="food f4">🍦</div>
  <div class="food f5">🌭</div>
  <div class="food f6">🍩</div>
</div>

<main>
  <h1 class="title">STEEEEEVE</h1>

  <div class="steve-stage">
    <img class="steve" src="media/steve.png" alt="Steve the monkey from Cloudy with a Chance of Meatballs" draggable="false">
    <button id="translator" type="button" aria-label="Press Steve's monkey thought translator">
      <span class="ring"></span>
    </button>
  </div>

  <p class="hint">press the thing on his chest</p>
</main>

<div class="scoreboard" aria-live="polite">
  <span class="score"><b id="count-press">0</b> presses</span>
  <span class="score rare"><b id="count-gummy">0</b> gummi bears</span>
</div>

<div id="shout" class="shout" aria-hidden="true">GUMMI&nbsp;BEARS!</div>
<div id="rain" class="rain" aria-hidden="true"></div>

<script src="script.js"></script>
</body>
</html>
